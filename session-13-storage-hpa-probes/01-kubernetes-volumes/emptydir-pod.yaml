apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
spec:
  containers:
  - name: writer
    image: busybox:1.36
    command: ['sh', '-c', 'while true; do echo "$(date): App healthy" >> /shared/status.txt; sleep 5; done']
    volumeMounts:
    - name: data-vol
      mountPath: /shared
  - name: reader
    image: busybox:1.36
    command: ['sh', '-c', 'sleep 2; tail -f /shared/status.txt']
    volumeMounts:
    - name: data-vol
      mountPath: /shared
  volumes:
  - name: data-vol
    emptyDir: {}
