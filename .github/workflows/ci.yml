name: TaskBoard CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/taskboard-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/taskboard-frontend

jobs:
  # ─── M2 & M5: AUTOMATED TESTING & QUALITY GATES ────────────────────────────
  test:
    name: Test & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r session-21-python/backend/requirements.txt
          pip install pydantic-settings

      - name: Run Pytest Suite
        env:
          DATABASE_URL: sqlite:///./test.db
          PYTHONPATH: session-21-python/backend
        run: |
          pytest session-21-python/backend/tests -v

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: session-21-python/frontend/package.json

      - name: Build Frontend Application
        working-directory: session-21-python/frontend
        run: |
          npm ci
          npm run build

  # ─── M5 & M6: DOCKER BUILD, TRIVY SECURITY SCAN & GHCR PUBLISH ─────────────
  build-and-security:
    name: Build, Scan & Publish Containers
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Backend Container ───
      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./session-21-python/backend
          file: ./session-21-python/backend/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}

      - name: Run Trivy Security Scan on Backend Image (SAST & Vulnerability)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Backend Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./session-21-python/backend
          file: ./session-21-python/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

      # ─── Frontend Container ───
      - name: Build Frontend Image (Multi-stage)
        uses: docker/build-push-action@v5
        with:
          context: ./session-21-python/frontend
          file: ./session-21-python/frontend/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}

      - name: Run Trivy Security Scan on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Frontend Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./session-21-python/frontend
          file: ./session-21-python/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest

  # ─── M8: HELM LINT & VALIDATION ────────────────────────────────────────────
  helm-validation:
    name: Helm Chart Validation
    needs: build-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint TaskBoard Helm Chart
        run: |
          helm lint session-21-python/helm/taskboard
